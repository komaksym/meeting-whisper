name: Build Ukrainian Bible M4B

on:
  pull_request:
    branches: [main]
    paths:
      - trigger-ukrainian-bible-build.txt

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SOURCE_URL: https://dl.bibleonline.ru/audio/ukr/bible.zip
      OUTPUT: ukrainian-bible-homenko-ihor-kozlov.m4b
      TAG: ukrainian-bible-m4b-2026-07-25
    steps:
      - name: Report runner start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title '[artifact] Ukrainian Bible M4B build started' \
            --body "Build started in https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip

      - name: Download and validate source archive
        run: |
          set -euxo pipefail
          curl --fail --location --retry 8 --retry-all-errors \
            --connect-timeout 30 --max-time 7200 \
            --output bible.zip "$SOURCE_URL"
          ls -lh bible.zip
          unzip -t bible.zip >/dev/null
          unzip -Z1 bible.zip > zip-entries.txt
          mkdir -p source
          unzip -q bible.zip -d source
          find source -type f -iname '*.mp3' | wc -l

      - name: Build ordered manifest and chapter metadata
        run: |
          cat > prepare.py <<'PY'
          from __future__ import annotations

          import json
          import re
          import subprocess
          import sys
          from collections import OrderedDict
          from decimal import Decimal, ROUND_HALF_UP
          from pathlib import Path, PurePosixPath

          archive_root = Path('source').resolve()

          def natural_key(value: str):
              return [int(p) if p.isdigit() else p.casefold()
                      for p in re.split(r'(\d+)', value)]

          def escape_concat(path: Path) -> str:
              return str(path).replace("'", "'\\''")

          def escape_ffmetadata(value: str) -> str:
              value = value.replace('\\', '\\\\')
              for char in ('=', ';', '#'):
                  value = value.replace(char, '\\' + char)
              return value.replace('\n', ' ').replace('\r', ' ').strip()

          def clean_component(value: str) -> str:
              value = re.sub(r'^\s*\d+[\s._-]*', '', value)
              value = value.replace('_', ' ')
              return re.sub(r'\s+', ' ', value).strip(' ._-')

          entries = [line.strip() for line in Path('zip-entries.txt').read_text(
              encoding='utf-8', errors='replace').splitlines()]
          mp3_entries = [e for e in entries if e.lower().endswith('.mp3')]
          if not mp3_entries:
              sys.exit('No MP3 entries found in the source ZIP.')

          # ZIP directory encounter order preserves the publisher's canonical book order.
          groups: OrderedDict[str, list[str]] = OrderedDict()
          for entry in mp3_entries:
              p = PurePosixPath(entry)
              groups.setdefault(str(p.parent), []).append(entry)

          ordered_entries = [
              entry
              for files in groups.values()
              for entry in sorted(files, key=natural_key)
          ]

          chapters = []
          concat_lines = []
          cumulative_ms = 0
          for index, entry in enumerate(ordered_entries, start=1):
              path = archive_root / Path(entry)
              if not path.is_file():
                  sys.exit(f'Missing extracted file: {entry}')
              result = subprocess.run(
                  ['ffprobe', '-v', 'error',
                   '-show_entries', 'format=duration:format_tags=title',
                   '-of', 'json', str(path)],
                  check=True, text=True, capture_output=True,
              )
              data = json.loads(result.stdout)
              duration = Decimal(data['format']['duration'])
              duration_ms = int((duration * 1000).quantize(
                  Decimal('1'), rounding=ROUND_HALF_UP))
              if duration_ms <= 0:
                  sys.exit(f'Invalid duration for {entry}')

              parent = clean_component(PurePosixPath(entry).parent.name)
              stem = clean_component(PurePosixPath(entry).stem)
              tag_title = data.get('format', {}).get('tags', {}).get('title', '').strip()
              title = tag_title or f'{parent} — {stem}'
              start_ms = cumulative_ms
              end_ms = start_ms + duration_ms
              chapters.append({
                  'index': index,
                  'entry': entry,
                  'title': title,
                  'start_ms': start_ms,
                  'end_ms': end_ms,
                  'duration_ms': duration_ms,
              })
              cumulative_ms = end_ms
              concat_lines.append(f"file '{escape_concat(path)}'")

          total_hours = cumulative_ms / 3_600_000
          if len(chapters) < 1000:
              sys.exit(f'Only {len(chapters)} MP3 chapters found.')
          if not 107 <= total_hours <= 111:
              sys.exit(f'Unexpected total duration: {total_hours:.3f} hours')

          half_ms = cumulative_ms / 2
          split_index = min(
              range(1, len(chapters)),
              key=lambda i: abs(chapters[i - 1]['end_ms'] - half_ms),
          )
          parts = [concat_lines[:split_index], concat_lines[split_index:]]
          for part_number, part_lines in enumerate(parts, start=1):
              Path(f'concat-part-{part_number}.txt').write_text(
                  '\n'.join(part_lines) + '\n', encoding='utf-8')

          metadata = [
              ';FFMETADATA1',
              'title=Українська Біблія — переклад Івана Хоменка',
              'artist=Читає Ігор Козлов',
              'album=Українська Аудіо Біблія',
              'genre=Audiobook',
              'comment=Джерело: ukrbible.at.ua / bibleonline.ru',
          ]
          for chapter in chapters:
              metadata.extend([
                  '[CHAPTER]',
                  'TIMEBASE=1/1000',
                  f"START={chapter['start_ms']}",
                  f"END={chapter['end_ms']}",
                  f"title={escape_ffmetadata(chapter['title'])}",
              ])
          Path('chapters.ffmeta').write_text(
              '\n'.join(metadata) + '\n', encoding='utf-8')

          manifest = {
              'source_url': 'https://dl.bibleonline.ru/audio/ukr/bible.zip',
              'chapter_count': len(chapters),
              'book_group_count': len(groups),
              'duration_ms': cumulative_ms,
              'duration_hours': round(total_hours, 6),
              'first_chapter': chapters[0],
              'last_chapter': chapters[-1],
              'parallel_split': {
                  'split_after_chapter_index': split_index,
                  'part_1_duration_hours': round(
                      chapters[split_index - 1]['end_ms'] / 3_600_000, 6),
                  'part_2_duration_hours': round(
                      (cumulative_ms - chapters[split_index - 1]['end_ms']) / 3_600_000, 6),
              },
              'book_groups': [
                  {'directory': group, 'chapter_files': len(files)}
                  for group, files in groups.items()
              ],
          }
          Path('build-manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8')
          print(json.dumps({
              'chapter_count': len(chapters),
              'book_group_count': len(groups),
              'duration_hours': round(total_hours, 3),
              'split_after_chapter_index': split_index,
              'first': chapters[0]['entry'],
              'last': chapters[-1]['entry'],
          }, ensure_ascii=False, indent=2))
          PY
          python3 prepare.py
          cat build-manifest.json

      - name: Encode two balanced AAC halves in parallel
        run: |
          set -euo pipefail

          encode_part() {
            local number="$1"
            ffmpeg -hide_banner -nostdin -y -loglevel error -nostats \
              -f concat -safe 0 -i "concat-part-${number}.txt" \
              -map 0:a:0 \
              -c:a aac -profile:a aac_low -b:a 40k -ar 32000 -ac 1 \
              -map_metadata -1 \
              "encoded-part-${number}.m4a" \
              >"encoded-part-${number}.log" 2>&1
          }

          encode_part 1 & pid1=$!
          encode_part 2 & pid2=$!

          set +e
          wait "$pid1"; status1=$?
          wait "$pid2"; status2=$?
          set -e

          if [ "$status1" -ne 0 ] || [ "$status2" -ne 0 ]; then
            echo "Part 1 status: $status1"
            cat encoded-part-1.log || true
            echo "Part 2 status: $status2"
            cat encoded-part-2.log || true
            exit 1
          fi

          ls -lh encoded-part-1.m4a encoded-part-2.m4a
          printf "file '%s'\nfile '%s'\n" \
            "$(pwd)/encoded-part-1.m4a" \
            "$(pwd)/encoded-part-2.m4a" > encoded-parts.txt

          ffmpeg -hide_banner -nostdin -y -loglevel error -nostats \
            -f concat -safe 0 -i encoded-parts.txt \
            -i chapters.ffmeta \
            -map 0:a:0 -map_metadata 1 -map_chapters 1 \
            -c:a copy \
            -metadata title='Українська Біблія — переклад Івана Хоменка' \
            -metadata artist='Читає Ігор Козлов' \
            -metadata album='Українська Аудіо Біблія' \
            -metadata genre='Audiobook' \
            -metadata media_type=2 \
            "$OUTPUT"
          ls -lh "$OUTPUT"

      - name: Verify output
        run: |
          set -euxo pipefail
          ffprobe -v error -show_entries \
            format=filename,duration,size,format_name:format_tags=title,artist,album \
            -of json "$OUTPUT" | tee output-probe.json
          ffprobe -v error -show_chapters -of json "$OUTPUT" > output-chapters.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('build-manifest.json').read_text())
          probe = json.loads(Path('output-probe.json').read_text())
          chapters = json.loads(Path('output-chapters.json').read_text())['chapters']
          duration = float(probe['format']['duration'])
          expected = manifest['duration_ms'] / 1000
          if abs(duration - expected) > 10:
              raise SystemExit(f'Duration mismatch: {duration} vs {expected}')
          if len(chapters) != manifest['chapter_count']:
              raise SystemExit(
                  f"Chapter mismatch: {len(chapters)} vs {manifest['chapter_count']}")
          size = Path(probe['format']['filename']).stat().st_size
          if size >= 2_100_000_000:
              raise SystemExit(f'Output too large for release asset: {size}')
          verification = {
              'duration_seconds': duration,
              'duration_hours': round(duration / 3600, 6),
              'chapter_count': len(chapters),
              'size_bytes': size,
              'first_chapter': chapters[0].get('tags', {}).get('title'),
              'last_chapter': chapters[-1].get('tags', {}).get('title'),
          }
          Path('verification.json').write_text(
              json.dumps(verification, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(verification, ensure_ascii=False, indent=2))
          PY
          sha256sum "$OUTPUT" | tee SHA256SUMS.txt

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release delete "$TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" \
            "$OUTPUT" build-manifest.json verification.json SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title 'Українська Біблія — один файл M4B' \
            --notes "Complete Ukrainian audio Bible in one chaptered M4B file. Translation: Ivan Khomenko. Narrator: Ihor Kozlov. AAC-LC mono 32 kHz, 40 kbps."

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title '[artifact] Ukrainian Bible M4B ready' \
            --body "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}\n\nDirect asset: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${OUTPUT}\n\nVerification:\n$(cat verification.json)\n\nSHA-256:\n$(cat SHA256SUMS.txt)"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title '[artifact] Ukrainian Bible M4B build failed' \
            --body "Build failed in https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} at commit ${GITHUB_SHA}."
